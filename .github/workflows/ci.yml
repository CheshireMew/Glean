name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GLEAN_ENV: test
      PYTHONUTF8: '1'
      JWT_SECRET_KEY: ci-only-secret-at-least-32-bytes-long
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-password
      npm_config_cache: D:\Tools\npm-cache

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock

      - name: Install release verification browser
        run: python -m playwright install chromium

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify backend
        run: |
          python -m compileall -q backend
          python -m ruff check backend shared scripts/windows --select F
          python -m unittest discover -s backend/tests -v

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run verify:architecture
          npm run build:release
          npm run verify:release
