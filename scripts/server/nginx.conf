# Include inside nginx's http {} context. Obtain a certificate before enabling
# the TLS server, and replace this domain/certificate path for another site.
limit_req_zone $binary_remote_addr zone=glean_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=glean_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=glean_connections:10m;

server {
    listen 80;
    server_name new.blacknico.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://new.blacknico.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name new.blacknico.com;
    ssl_certificate /etc/letsencrypt/live/new.blacknico.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.blacknico.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/glean/frontend/dist;
    index index.html;
    client_max_body_size 2m;
    client_body_timeout 15s;
    limit_conn glean_connections 20;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/login {
        client_max_body_size 4k;
        limit_req zone=glean_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /api/ {
        limit_req zone=glean_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
    location ^~ /health/ { return 404; }
    location ~ /\. { deny all; }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        try_files $uri =404;
        expires 30d;
    }
    location / { try_files $uri $uri/ /index.html; }
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
